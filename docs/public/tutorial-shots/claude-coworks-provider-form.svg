<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Claude Coworks 配置 MaoLao API 推理供应商示意图">
  <rect width="1200" height="800" fill="#f7f5f2"/>
  <rect x="88" y="46" width="1024" height="706" rx="8" fill="#ffffff" stroke="#ded9d2"/>
  <text x="132" y="102" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25" font-weight="700" fill="#2f2925">添加推理供应商</text>
  <rect x="132" y="138" width="936" height="572" rx="8" fill="#faf8f6" stroke="#e4ded8"/>
  <text x="168" y="188" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2f2925">供应商名称</text>
  <rect x="360" y="158" width="518" height="46" rx="6" fill="#fff" stroke="#cfc7bf"/>
  <text x="382" y="188" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#2f2925">MaoLao API</text>
  <circle cx="904" cy="181" r="16" fill="#ef4444"/>
  <text x="899" y="187" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="168" y="266" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2f2925">供应商类型</text>
  <rect x="360" y="236" width="518" height="46" rx="6" fill="#fff" stroke="#cfc7bf"/>
  <text x="382" y="266" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#2f2925">Anthropic-compatible gateway</text>
  <circle cx="904" cy="259" r="16" fill="#ef4444"/>
  <text x="899" y="265" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <text x="168" y="344" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2f2925">Gateway Base URL</text>
  <rect x="360" y="314" width="518" height="46" rx="6" fill="#fff" stroke="#cfc7bf"/>
  <text x="382" y="344" font-family="Consolas,'Microsoft YaHei',monospace" font-size="15" fill="#2f2925">https://api.maolaoapi.cc/v1</text>
  <circle cx="904" cy="337" r="16" fill="#ef4444"/>
  <text x="899" y="343" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <text x="168" y="422" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2f2925">API Key</text>
  <rect x="360" y="392" width="518" height="46" rx="6" fill="#fff" stroke="#cfc7bf"/>
  <text x="382" y="422" font-family="Consolas,'Microsoft YaHei',monospace" font-size="15" fill="#2f2925">sk-xxxxxxxxxxxxxxxx</text>
  <circle cx="904" cy="415" r="16" fill="#ef4444"/>
  <text x="899" y="421" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">4</text>
  <text x="168" y="500" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2f2925">认证方式</text>
  <rect x="360" y="470" width="518" height="46" rx="6" fill="#fff" stroke="#cfc7bf"/>
  <text x="382" y="500" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#2f2925">API Key</text>
  <circle cx="904" cy="493" r="16" fill="#ef4444"/>
  <text x="899" y="499" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">5</text>
  <text x="168" y="578" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2f2925">手动模型配置</text>
  <rect x="360" y="548" width="518" height="46" rx="6" fill="#fff" stroke="#cfc7bf"/>
  <text x="382" y="578" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#6b625d">开启后，从 MaoLao 模型与价格页复制完整模型名</text>
  <circle cx="904" cy="571" r="16" fill="#ef4444"/>
  <text x="899" y="577" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">6</text>
  <rect x="870" y="640" width="150" height="46" rx="7" fill="#d97745"/>
  <text x="916" y="670" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#fff">保存</text>
  <rect x="132" y="730" width="936" height="32" rx="6" fill="#ecfdf5"/>
  <text x="152" y="752" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#166534">小白提示：最重要的是第 3、4、5 项。地址不要填 HaoAI 地址，必须填 MaoLao API 地址。</text>
</svg>
