<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Claude Coworks 开启开发者模式并添加推理供应商示意图">
  <rect width="1200" height="760" fill="#f7f5f2"/>
  <rect x="84" y="54" width="1032" height="652" rx="8" fill="#ffffff" stroke="#ded9d2"/>
  <rect x="84" y="54" width="1032" height="68" rx="8" fill="#2f2925"/>
  <circle cx="122" cy="88" r="8" fill="#ff6b5f"/>
  <circle cx="148" cy="88" r="8" fill="#f5bb4b"/>
  <circle cx="174" cy="88" r="8" fill="#65c466"/>
  <text x="214" y="96" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#ffffff">Claude Coworks</text>
  <rect x="118" y="154" width="246" height="512" rx="8" fill="#f8f7f5"/>
  <text x="150" y="202" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#302a26">设置</text>
  <rect x="140" y="244" width="202" height="46" rx="7" fill="#f2e2d7"/>
  <text x="164" y="273" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#7a3923">开发者</text>
  <circle cx="350" cy="267" r="16" fill="#ef4444"/>
  <text x="345" y="273" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">1</text>
  <text x="150" y="348" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#6b625d">通用</text>
  <text x="150" y="394" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#6b625d">外观</text>
  <text x="150" y="440" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#6b625d">账户</text>
  <rect x="400" y="154" width="682" height="512" rx="8" fill="#fff" stroke="#e6e1dc"/>
  <text x="438" y="208" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2f2925">开发者模式</text>
  <text x="438" y="252" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#6b625d">启用后可以添加第三方推理供应商。</text>
  <rect x="438" y="298" width="604" height="76" rx="8" fill="#faf8f6" stroke="#e3ddd7"/>
  <text x="466" y="344" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#2f2925">允许使用第三方推理服务</text>
  <rect x="956" y="320" width="62" height="32" rx="16" fill="#10b981"/>
  <circle cx="996" cy="336" r="13" fill="#fff"/>
  <circle cx="932" cy="336" r="16" fill="#ef4444"/>
  <text x="927" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">2</text>
  <rect x="438" y="424" width="604" height="112" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="466" y="464" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#7c2d12">第三方推理供应商</text>
  <text x="466" y="502" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#9a3412">先开启开发者模式，再新增一个供应商。</text>
  <rect x="862" y="456" width="144" height="42" rx="7" fill="#d97745"/>
  <text x="889" y="483" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">添加供应商</text>
  <circle cx="1026" cy="477" r="16" fill="#ef4444"/>
  <text x="1021" y="483" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">3</text>
  <rect x="438" y="578" width="604" height="46" rx="7" fill="#ecfdf5"/>
  <text x="462" y="607" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#166534">完成这一步后，继续填写网关地址、API Key 和模型。</text>
